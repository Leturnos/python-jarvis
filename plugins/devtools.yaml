id: "devtools"
name: "DevTools & Programação"
description: "Automações para fluxo de trabalho de desenvolvedores, terminais e editores"
category: "Desenvolvimento"
version: "1.1.0"

shared_actions:
  preparar_ambiente:
    - type: "system_open"
      target: "${WARP_PATH}"
    - type: "wait"
      duration: 0.5
    - type: "keyboard_shortcut"
      keys: ["ctrl", "shift", "t"]
    - type: "wait"
      duration: 1.0
    - type: "type_and_enter"
      text: "cd ${PROJECT_PATH}"
    - type: "wait"
      duration: 0.5

commands:
  - intent: "iniciar_backend"
    phrases: 
      - "ligar o servidor"
      - "rodar o backend"
      - "iniciar o backend"
      - "subir o backend"
    description: "Abre o terminal na pasta do projeto e roda o servidor Node/Python"
    risk_level: "safe"
    actions:
      - type: "include"
        name: "preparar_ambiente"
      - type: "type_and_enter"
        text: "npm run dev"

  - intent: "programar"
    phrases:
      - "hora de programar"
      - "preparar ambiente de código"
      - "abrir vscode e terminal"
    description: "Prepara o ambiente de trabalho: abre o terminal e o VS Code"
    risk_level: "safe"
    actions:
      - type: "include"
        name: "preparar_ambiente"
      - type: "type_and_enter"
        text: "code ."
      - type: "wait"
        duration: 0.5
      - type: "type_and_enter"
        text: "agy"

  - intent: "abrir_terminal"
    phrases:
      - "abrir terminal"
      - "abrir o terminal"
      - "abrir terminal warp"
      - "abrir terminal de comando"
      - "abrir console"
    description: "Abre o terminal configurado (Warp ou padrão do sistema)"
    risk_level: "safe"
    actions:
      - type: "system_open"
        target: "${WARP_PATH}"

  - intent: "abrir_vscode"
    phrases:
      - "abrir vscode"
      - "abrir o vscode"
      - "abrir visual studio code"
      - "abrir editor de código"
    description: "Abre o Visual Studio Code"
    risk_level: "safe"
    actions:
      - type: "system_open"
        target: "code"

  - intent: "git_status"
    phrases:
      - "ver git status"
      - "como está o git"
      - "ver status do git"
    description: "Digita git status no terminal ativo"
    risk_level: "safe"
    actions:
      - type: "type_and_enter"
        text: "git status"
