# ==============================================================================
# JARVIS AI ASSISTANT - CONFIGURAÇÃO GERAL
# ==============================================================================

# Perfil de Desempenho: auto, ultra_economic, economic, balanced, performance
# (Controla o consumo de RAM, modelo Whisper STT e velocidade de execução)
performance_profile: "auto"

paths:
  data_dir: "data"
  models_dir: "models"

# Configurações de Ativação por Voz
voice_activation:
  mode: "hybrid"                      # hybrid, push_to_talk, always_listening
  response_phrase: "Sim?"             # Frase falada pelo Jarvis ao ser ativado
  volume_multiplier: 1.0              # Ganho do microfone (1.0 = padrão, >1.0 amplifica)
  device_index: null                  # Índice do microfone (null = microfone padrão do Windows)
  wake_word:
    enabled: true
    keyword: "hey_jarvis"
  push_to_talk:
    key: "ctrl+alt"
    behavior: "hold"

# Paleta de Comandos (UI)
command_palette:
  key: "ctrl+shift+p"                 # Atalho de teclado global (ex: ctrl+shift+p, ctrl+alt+p)

# Sintetizador de Voz (TTS)
tts:
  provider: "sapi5"
  voice_keyword: "maria"              # Nome ou parte do nome da voz instalada no Windows
  rate: 2                             # Velocidade da fala (-10 a 10)
  volume: 100                         # Volume da fala (0 a 100)

# Efeitos Sonoros (Beeps de feedback)
audio_cues:
  enabled: true                       # true para emitir bips sonoros nos estados de ativação

# Comportamento Cognitivo da IA
ai:
  proactivity: "objective"            # "objective" (direto e conciso) ou "proactive" (sugere recomendações práticas)
  max_conversation_turns: 5           # Número de interações recentes mantidas na memória de diálogo

# Provedores de Inteligência Artificial (LLM)
llm:
  active_provider: "openrouter"       # Provedor ativo: gemini, openai, anthropic, deepseek, openrouter
  providers:
    gemini:
      model: "gemini-2.5-flash"
    openai:
      model: "gpt-4.1-mini"
    anthropic:
      model: "claude-3-5-haiku-latest"
    deepseek:
      model: "deepseek-chat"
    openrouter:
      model: "google/gemini-2.5-flash"

# Segurança e Confirmação de Ações de Risco
dry_run:
  enabled: true                       # Solicita autorização na tela para comandos com risco
  bypass_for_safe_intents: true       # Executa ações de leitura e seguras sem pedir confirmação

# Integrações e Terminais
integrations:
  warp:
    path: "${WARP_PATH}"

# Aplicativos Confiáveis (Permitidos para abertura direta)
security:
  trusted_apps:
    - name: "warp"
      path: "${WARP_PATH}"
      allowed_actions: ["system_open"]
    - name: "spotify"
      path: "C:\\Program Files\\Spotify\\Spotify.exe"
      allowed_actions: ["system_open"]


# ==============================================================================
# FERRAMENTAS E INTEGRAÇÕES SEGURAS (LEAST PRIVILEGE)
# ==============================================================================
tools:
  web_search:
    enabled: true
    provider: "duckduckgo"          # duckduckgo ou tavily
    max_results: 3
    timeout_seconds: 5.0

  developer:
    enabled: true
    # Apenas os diretórios abaixo podem ser inspecionados ou manipulados:
    allowed_workspaces:
      - "."
      - "C:\\Programacao\\python-jarvis"
    git:
      allow_commit: true            # Permite commitar após autorização na tela
      max_diff_lines: 300           # Proteção contra diffs massivos
    project:
      max_file_size_kb: 50          # Limite de leitura por arquivo

  weather:
    enabled: true
    default_city: "São Paulo"       # Cidade padrão caso não informada
    timeout_seconds: 5.0

  finance:
    enabled: true
    timeout_seconds: 5.0

  calculator:
    enabled: true

