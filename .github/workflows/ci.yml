name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Run Ruff Lint
        run: uv run ruff check

      - name: Run Ruff Format check
        run: uv run ruff format --check

      - name: Run MyPy
        run: uv run mypy

      - name: Run Test Suite + Coverage
        env:
          QT_QPA_PLATFORM: offscreen
        run: uv run pytest --cov=core --cov-report=term-missing --cov-report=xml --cov-fail-under=70
